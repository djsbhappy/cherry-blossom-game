<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>음식 잡기 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #b8d4f0; touch-action: none; }
        /* 비디오를 CSS 배경으로 깔아 drawImage 제거 */
        #video {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 0;
        }
        #gameCanvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }
        .glass-panel { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); }
        .pink-glow { text-shadow: 0 0 10px #ffb7c5, 0 0 20px #ffb7c5; }
    </style>
</head>
<body class="relative text-white font-sans">
    <video id="video" autoplay playsinline></video>
    <canvas id="gameCanvas"></canvas>

    <!-- 인게임 HUD -->
    <div id="hud" class="fixed top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none hidden z-10">
        <div class="flex flex-col">
            <span class="text-xl text-pink-300 font-bold">점수</span>
            <span id="scoreDisplay" class="text-5xl font-extrabold pink-glow">0</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-xl text-pink-300 font-bold">남은 시간</span>
            <span id="timerDisplay" class="text-5xl font-extrabold">30</span>
        </div>
    </div>

    <!-- 로딩 화면 -->
    <div id="loadingScreen" class="fixed inset-0 flex flex-col items-center justify-center z-50" style="background-color:#b8d4f0">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-pink-400 mb-4"></div>
        <h2 class="text-2xl font-bold text-pink-300">카메라 및 AI 모델 로딩 중...</h2>
        <p class="text-gray-400 mt-2">최적화 모드로 준비 중입니다.</p>
    </div>

    <!-- 메인 메뉴 -->
    <div id="menuScreen" class="fixed inset-0 flex flex-col items-center justify-center z-40 glass-panel hidden">
        <h1 class="text-6xl font-extrabold text-yellow-400 mb-8" style="text-shadow:0 0 10px #ffe066,0 0 20px #ffe066">🍕 음식 잡기 🍔</h1>
        <p class="text-xl mb-8 text-center max-w-md text-gray-200">
            카메라 앞에서 <span class="text-yellow-300 font-bold">손바닥을 펴서 음식에 대고 주먹을 쥐어(Grab)</span> 떨어지는 음식을 잡으세요!
        </p>
        <button id="startBtn" class="px-8 py-4 bg-pink-500 hover:bg-pink-600 rounded-full text-2xl font-bold transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(236,72,153,0.5)] mb-8">
            게임 시작
        </button>
        <div class="w-full max-w-sm bg-gray-800 bg-opacity-80 rounded-xl p-6 border border-pink-900 shadow-xl">
            <h2 class="text-2xl font-bold text-center text-pink-300 mb-4 border-b border-pink-800 pb-2">🏆 명예의 전당 (Top 5)</h2>
            <ul id="menuLeaderboard" class="space-y-2">
                <li class="text-center text-gray-400">데이터를 불러오는 중...</li>
            </ul>
        </div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameOverScreen" class="fixed inset-0 flex flex-col items-center justify-center z-40 glass-panel hidden overflow-y-auto">
        <h1 class="text-5xl font-extrabold text-red-400 mb-2">TIME OVER</h1>
        <div class="text-2xl mb-6">최종 점수: <span id="finalScore" class="text-5xl font-bold text-pink-400 pink-glow ml-2">0</span></div>
        <div id="nameInputSection" class="flex flex-col items-center mb-8">
            <p class="mb-2 text-pink-200">순위표에 등록할 이름을 입력하세요</p>
            <div class="flex">
                <input type="text" id="playerName" placeholder="닉네임 (최대 8자)" maxlength="8" class="px-4 py-3 rounded-l-lg bg-gray-700 text-white border-none focus:ring-2 focus:ring-pink-500 outline-none w-48">
                <button id="submitScoreBtn" class="px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-r-lg font-bold transition-colors">등록</button>
            </div>
            <p id="submitMsg" class="text-sm mt-2 text-green-400 hidden">점수가 등록되었습니다!</p>
        </div>
        <div class="w-full max-w-sm bg-gray-800 bg-opacity-80 rounded-xl p-6 border border-pink-900 shadow-xl mb-6">
            <h2 class="text-2xl font-bold text-center text-pink-300 mb-4 border-b border-pink-800 pb-2">🏆 명예의 전당</h2>
            <ul id="gameOverLeaderboard" class="space-y-2"></ul>
        </div>
        <button id="restartBtn" class="px-8 py-3 bg-gray-600 hover:bg-gray-500 rounded-full text-xl font-bold transition-colors shadow-lg">
            다시 시작하기
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

        // ==========================================
        // Firebase (순위표)
        // ==========================================
        let db, auth, currentUser;
        let useLocalStorage = false;

        // localStorage 기반 리더보드 (Firebase 미설정 시 폴백)
        const LS_KEY = 'cherry_blossom_leaderboard';
        const getLocalScores = () => {
            try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
            catch { return []; }
        };
        const saveLocalScore = (name, score) => {
            const scores = getLocalScores();
            scores.push({ name, score, timestamp: Date.now() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem(LS_KEY, JSON.stringify(scores.slice(0, 5)));
        };

        const initFirebase = async () => {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cherry-blossom-game';
                if (!firebaseConfig) {
                    console.warn("Firebase config not found. localStorage 리더보드로 전환합니다.");
                    useLocalStorage = true;
                    topScores = getLocalScores();
                    renderLeaderboard();
                    return null;
                }
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                return new Promise((resolve) => {
                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) setupLeaderboard(appId);
                        resolve(user);
                    });
                });
            } catch (e) { console.error("Firebase init error:", e); }
        };

        let topScores = [];
        const setupLeaderboard = (appId) => {
            if (!currentUser || !db) return;
            const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            onSnapshot(scoresRef, (snapshot) => {
                topScores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => b.score - a.score).slice(0, 5);
                renderLeaderboard();
            }, (error) => console.error("Leaderboard fetch error:", error));
        };

        const renderLeaderboard = () => {
            const html = topScores.length === 0
                ? `<li class="text-center text-gray-400">아직 등록된 점수가 없습니다.</li>`
                : topScores.map((s, i) => {
                    const colors = ['text-yellow-400','text-gray-300','text-amber-600','text-white','text-white'];
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                    return `<li class="flex justify-between items-center bg-gray-700 bg-opacity-50 px-4 py-2 rounded">
                        <span class="font-bold ${colors[i]}">${medal} ${s.name}</span>
                        <span class="font-bold text-pink-300">${s.score}점</span></li>`;
                }).join('');
            document.getElementById('menuLeaderboard').innerHTML = html;
            document.getElementById('gameOverLeaderboard').innerHTML = html;
        };

        const saveScoreToFirebase = async (name, score) => {
            if (score <= 0) return false;
            if (useLocalStorage) {
                saveLocalScore(name || "무명", score);
                topScores = getLocalScores();
                renderLeaderboard();
                return true;
            }
            if (!currentUser || !db) return false;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cherry-blossom-game';
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'), {
                    name: name || "무명", score, uid: currentUser.uid, timestamp: serverTimestamp()
                });
                return true;
            } catch (e) { console.error("Score save error:", e); return false; }
        };

        // ==========================================
        // 게임 코어
        // ==========================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- [최적화] 이모지 사전 렌더링 캐시 (어린이 좋아하는 음식 8종) ---
        const BLOSSOM_CACHE_SIZE = 64;
        const FOOD_EMOJIS = ['🍕','🍔','🍩','🍦','🍭','🍪','🍫','🍟'];
        const foodCaches = FOOD_EMOJIS.map(emoji => {
            const c = document.createElement('canvas');
            c.width = BLOSSOM_CACHE_SIZE;
            c.height = BLOSSOM_CACHE_SIZE;
            const cx = c.getContext('2d');
            cx.font = `${BLOSSOM_CACHE_SIZE - 8}px Arial`;
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            cx.fillText(emoji, BLOSSOM_CACHE_SIZE / 2, BLOSSOM_CACHE_SIZE / 2);
            return c;
        });

        // "+10" 파티클 캐시
        const plusTenCache = document.createElement('canvas');
        plusTenCache.width = 56; plusTenCache.height = 32;
        const pCacheCtx = plusTenCache.getContext('2d');
        pCacheCtx.fillStyle = "#ffe066";
        pCacheCtx.font = "bold 24px Arial";
        pCacheCtx.textAlign = "center";
        pCacheCtx.textBaseline = "middle";
        pCacheCtx.fillText("+10", 28, 16);

        // "+100" 파티클 캐시 (황금)
        const plusHundredCache = document.createElement('canvas');
        plusHundredCache.width = 80; plusHundredCache.height = 36;
        const phCtx = plusHundredCache.getContext('2d');
        phCtx.fillStyle = "#ff4444";
        phCtx.font = "bold 28px Arial";
        phCtx.textAlign = "center";
        phCtx.textBaseline = "middle";
        phCtx.fillText("+100", 40, 18);

        // 특별 아이템 황금 글로우 캐시
        const specialGlowCache = document.createElement('canvas');
        specialGlowCache.width = 128; specialGlowCache.height = 128;
        const sgCtx = specialGlowCache.getContext('2d');
        const sg = sgCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
        sg.addColorStop(0,   'rgba(255, 220, 0, 0.85)');
        sg.addColorStop(0.4, 'rgba(255, 160, 0, 0.45)');
        sg.addColorStop(1,   'rgba(255, 100, 0, 0)');
        sgCtx.fillStyle = sg;
        sgCtx.fillRect(0, 0, 128, 128);

        // "⭐100" 뱃지 캐시 (아이템 위에 표시)
        const hundredBadgeCache = document.createElement('canvas');
        hundredBadgeCache.width = 64; hundredBadgeCache.height = 24;
        const hbCtx = hundredBadgeCache.getContext('2d');
        hbCtx.fillStyle = "rgba(200, 0, 0, 0.88)";
        hbCtx.fillRect(0, 0, 64, 24);
        hbCtx.fillStyle = "#ffffff";
        hbCtx.font = "bold 14px Arial";
        hbCtx.textAlign = "center";
        hbCtx.textBaseline = "middle";
        hbCtx.fillText("⭐ 100", 32, 12);

        // --- [최적화] 글로우용 그라디언트 캐시 ---
        // 크기가 달라질 수 있으므로 createRadialGradient를 직접 캐시하긴 어렵지만
        // 고정 크기 글로우 이미지를 만들어 스케일링으로 사용
        const GLOW_SIZE = 128;
        const grabGlowCache = document.createElement('canvas');
        grabGlowCache.width = GLOW_SIZE;
        grabGlowCache.height = GLOW_SIZE;
        const gGCtx = grabGlowCache.getContext('2d');
        const gg = gGCtx.createRadialGradient(GLOW_SIZE/2, GLOW_SIZE/2, 0, GLOW_SIZE/2, GLOW_SIZE/2, GLOW_SIZE/2);
        gg.addColorStop(0, 'rgba(0, 255, 100, 0.5)');
        gg.addColorStop(0.7, 'rgba(0, 255, 100, 0.2)');
        gg.addColorStop(1, 'rgba(0, 255, 100, 0)');
        gGCtx.fillStyle = gg;
        gGCtx.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);

        const openGlowCache = document.createElement('canvas');
        openGlowCache.width = GLOW_SIZE;
        openGlowCache.height = GLOW_SIZE;
        const oGCtx = openGlowCache.getContext('2d');
        const og = oGCtx.createRadialGradient(GLOW_SIZE/2, GLOW_SIZE/2, 0, GLOW_SIZE/2, GLOW_SIZE/2, GLOW_SIZE/2);
        og.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
        og.addColorStop(1, 'rgba(255, 255, 255, 0)');
        oGCtx.fillStyle = og;
        oGCtx.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);

        // 오디오
        let audioCtx;
        const initAudio = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };
        const playCatchSound = () => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        };

        // 배경음악 (Web Audio API, 8비트 스타일 신나는 루프)
        let bgmActive = false;
        let bgmMasterGain = null;

        // 16분음표 단위 멜로디 (주파수Hz, 박자수)
        // 120BPM → 16분음표 = 0.125초
        const BGM_BEAT = 0.125;
        const BGM_MELODY = [
            [659.25,2],[783.99,2],[1046.5,2],[783.99,2],
            [659.25,2],[523.25,2],[587.33,4],
            [587.33,2],[659.25,2],[783.99,2],[880.00,2],
            [783.99,2],[659.25,2],[523.25,4],
            [880.00,2],[880.00,2],[1046.5,2],[880.00,2],
            [783.99,2],[659.25,2],[523.25,4],
            [659.25,2],[587.33,2],[523.25,2],[440.00,2],
            [493.88,2],[523.25,2],[659.25,8],
        ];
        const BGM_BASS = [
            [130.81,8],[146.83,8],[174.61,8],[130.81,8],
            [130.81,8],[174.61,8],[196.00,8],[130.81,8],
        ];

        const scheduleTrack = (notes, startTime, gain) => {
            let t = startTime;
            notes.forEach(([freq, beats]) => {
                const dur = beats * BGM_BEAT;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0.4, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.85);
                osc.connect(g);
                g.connect(gain);
                osc.start(t);
                osc.stop(t + dur);
                t += dur;
            });
            return t; // 루프 끝 시간 반환
        };

        const playBGM = () => {
            if (!audioCtx || bgmActive) return;
            bgmActive = true;

            bgmMasterGain = audioCtx.createGain();
            bgmMasterGain.gain.setValueAtTime(0, audioCtx.currentTime);
            bgmMasterGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.5);
            bgmMasterGain.connect(audioCtx.destination);

            const melodyLen = BGM_MELODY.reduce((s,[,b]) => s + b * BGM_BEAT, 0);
            const bassLen   = BGM_BASS.reduce((s,[,b]) => s + b * BGM_BEAT, 0);
            const loopLen   = Math.max(melodyLen, bassLen);

            const loop = (startTime) => {
                if (!bgmActive) return;
                scheduleTrack(BGM_MELODY, startTime, bgmMasterGain);
                scheduleTrack(BGM_BASS,   startTime, bgmMasterGain);
                setTimeout(() => loop(startTime + loopLen), (loopLen - 0.3) * 1000);
            };
            loop(audioCtx.currentTime + 0.05);
        };

        const stopBGM = () => {
            bgmActive = false;
            if (bgmMasterGain && audioCtx) {
                bgmMasterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.15);
            }
        };

        // UI
        const ui = {
            loading: document.getElementById('loadingScreen'),
            menu: document.getElementById('menuScreen'),
            hud: document.getElementById('hud'),
            gameOver: document.getElementById('gameOverScreen'),
            scoreDisp: document.getElementById('scoreDisplay'),
            timerDisp: document.getElementById('timerDisplay'),
            finalScoreDisp: document.getElementById('finalScore'),
            nameInput: document.getElementById('playerName'),
            submitMsg: document.getElementById('submitMsg'),
            btnStart: document.getElementById('startBtn'),
            btnSubmit: document.getElementById('submitScoreBtn'),
            btnRestart: document.getElementById('restartBtn')
        };

        let handLandmarker;
        let lastVideoTime = -1;
        let animationFrameId;

        // --- [최적화] AI 추론 주기 확대 (100ms → 150ms, ~7FPS 추적) ---
        let lastInferenceTime = 0;
        const INFERENCE_INTERVAL = 150;

        // --- [최적화] 손 위치 보간용 데이터 ---
        let prevGrabPosList = [];
        let currGrabPosList = [];
        let interpT = 0;
        let lastInferenceTimestamp = 0;

        // --- [최적화] 프레임 레이트 상한 (60fps) ---
        let lastFrameTime = 0;
        const FRAME_CAP_MS = 1000 / 60;

        // --- [최적화] grabPos 객체 풀 (매 프레임 allocation 방지) ---
        const _grabPosPool = [
            {x:0, y:0, radius:0, isGrab:false},
            {x:0, y:0, radius:0, isGrab:false}
        ];

        const GAME_DURATION = 30;
        let state = {
            status: 'LOADING',
            score: 0,
            timeLeft: GAME_DURATION,
            lastTick: 0,
            blossoms: [],
            particles: [],
            isGrabbing: false,
            grabPosList: []
        };

        // --- [최적화] 벚꽃 개수 제한 (최대 120개) ---
        class Blossom {
            constructor() { this.reset(); this.y = Math.random() * canvas.height; }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -50;
                this.size = Math.random() * 20 + 20;
                this.speed = Math.random() * 5 + 4;
                this.swaySpeed = Math.random() * 0.05 + 0.02;
                this.swayAmount = Math.random() * 50 + 20;
                this.seed = Math.random() * 100;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
                this.active = true;
                this.isSpecial = Math.random() < 0.07; // 7% 확률로 100점짜리
                this.cache = foodCaches[Math.floor(Math.random() * foodCaches.length)];
                this.size = (Math.random() * 20 + 20) * (this.isSpecial ? 1.5 : 1);
                this.speed = (Math.random() * 5 + 4) * (this.isSpecial ? 0.75 : 1); // 특별 아이템은 천천히
                // --- [최적화] 드로우 크기 사전 계산 (매 프레임 나눗셈 제거) ---
                const _s = this.size / (BLOSSOM_CACHE_SIZE - 8);
                this.drawSize = BLOSSOM_CACHE_SIZE * _s;
                this.halfSize = this.drawSize * 0.5;
            }
            update(time) {
                if (!this.active) return;
                this.y += this.speed;
                this.x += Math.sin(time * this.swaySpeed + this.seed) * 2;
                this.rotation += this.rotSpeed;
                if (this.y > canvas.height + 50) this.reset();
            }
            draw(ctx, timestamp) {
                if (!this.active) return;
                const cos = Math.cos(this.rotation);
                const sin = Math.sin(this.rotation);

                if (this.isSpecial) {
                    // 황금 글로우 (화면 기준 고정, 맥동 효과)
                    const pulse = 1 + 0.25 * Math.sin(timestamp * 0.005);
                    const glowSize = this.drawSize * 2.8 * pulse;
                    ctx.setTransform(1, 0, 0, 1, this.x, this.y);
                    ctx.drawImage(specialGlowCache, -glowSize / 2, -glowSize / 2, glowSize, glowSize);
                }

                // 음식 이모지 (회전 적용)
                ctx.setTransform(cos, sin, -sin, cos, this.x, this.y);
                ctx.drawImage(this.cache, -this.halfSize, -this.halfSize, this.drawSize, this.drawSize);

                if (this.isSpecial) {
                    // "⭐100" 뱃지 (항상 똑바로)
                    ctx.setTransform(1, 0, 0, 1, this.x, this.y);
                    ctx.drawImage(hundredBadgeCache, -32, -this.halfSize - 26);
                }
            }
        }

        // --- [최적화] 파티클도 캐시 이미지 사용 ---
        class Particle {
            constructor(x, y, cache) {
                this.x = x; this.y = y; this.life = 1.0;
                this.dy = cache === plusHundredCache ? -3 : -2;
                this.cache = cache;
            }
            update() { this.y += this.dy; this.life -= 0.03; }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.globalAlpha = this.life;
                ctx.drawImage(this.cache, this.x - this.cache.width / 2, this.y - this.cache.height / 2);
                ctx.globalAlpha = 1;
            }
        }

        const resizeCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // --- [최적화] 벚꽃 최대 120개 ---
            const count = Math.min(Math.floor((canvas.width * canvas.height) / 12000), 120);
            state.blossoms = [];
            for (let i = 0; i < count; i++) state.blossoms.push(new Blossom());
        };
        window.addEventListener('resize', resizeCanvas);

        const startCamera = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
                });
                video.srcObject = stream;
                return new Promise(resolve => { video.onloadedmetadata = resolve; });
            } catch (err) {
                alert("카메라 접근 권한이 필요합니다!");
                console.error(err);
            }
        };

        const initMediaPipe = async () => {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });
        };

        const changeState = (newState) => {
            state.status = newState;
            ui.loading.classList.add('hidden');
            ui.menu.classList.add('hidden');
            ui.hud.classList.add('hidden');
            ui.gameOver.classList.add('hidden');
            if (newState === 'MENU') ui.menu.classList.remove('hidden');
            if (newState === 'PLAYING') ui.hud.classList.remove('hidden');
            if (newState === 'GAMEOVER') ui.gameOver.classList.remove('hidden');
        };

        const startGame = () => {
            initAudio();
            stopBGM();
            setTimeout(playBGM, 100);
            state.score = 0;
            state.timeLeft = GAME_DURATION;
            state.lastTick = performance.now();
            ui.scoreDisp.innerText = state.score;
            ui.timerDisp.innerText = state.timeLeft;
            state.particles = [];
            state.blossoms.forEach(b => b.reset());
            ui.nameInput.value = '';
            ui.submitMsg.classList.add('hidden');
            ui.btnSubmit.disabled = false;
            ui.btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            changeState('PLAYING');
        };

        const gameOverFunc = () => {
            stopBGM();
            changeState('GAMEOVER');
            ui.finalScoreDisp.innerText = state.score;
        };

        // lerpPos 제거 — 인라인 풀 방식으로 대체

        // 스켈레톤 렌더링용 랜드마크 저장
        let currHandLandmarks = [];

        // MediaPipe 손 연결 인덱스
        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],         // 엄지
            [0,5],[5,6],[6,7],[7,8],          // 검지
            [0,9],[9,10],[10,11],[11,12],     // 중지
            [0,13],[13,14],[14,15],[15,16],   // 약지
            [0,17],[17,18],[18,19],[19,20],   // 새끼
            [5,9],[9,13],[13,17]              // 손바닥
        ];

        const drawHandSkeleton = (landmarks, isGrab) => {
            const lineColor = isGrab ? 'rgba(80,255,160,0.9)' : 'rgba(255,255,255,0.85)';
            const jointColor = isGrab ? '#50ffa0' : '#ffffff';
            const tipColor   = isGrab ? '#ffff66' : '#aaddff';

            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (const [a, b] of HAND_CONNECTIONS) {
                ctx.moveTo((1 - landmarks[a].x) * canvas.width, landmarks[a].y * canvas.height);
                ctx.lineTo((1 - landmarks[b].x) * canvas.width, landmarks[b].y * canvas.height);
            }
            ctx.stroke();

            // 관절
            ctx.fillStyle = jointColor;
            for (let i = 0; i < landmarks.length; i++) {
                const lm = landmarks[i];
                ctx.beginPath();
                ctx.arc((1 - lm.x) * canvas.width, lm.y * canvas.height, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 손가락 끝 (더 크게, 다른 색)
            ctx.fillStyle = tipColor;
            for (const tip of [4, 8, 12, 16, 20]) {
                ctx.beginPath();
                ctx.arc((1 - landmarks[tip].x) * canvas.width, landmarks[tip].y * canvas.height, 7, 0, Math.PI * 2);
                ctx.fill();
            }
        };

        // ==========================================
        // 메인 루프
        // ==========================================
        const gameLoop = (timestamp) => {
            animationFrameId = requestAnimationFrame(gameLoop);
            // --- [최적화] 프레임 레이트 상한 (120Hz+ 디바이스 대응) ---
            if (timestamp - lastFrameTime < FRAME_CAP_MS) return;
            lastFrameTime = timestamp;

            // --- [최적화] 비디오 drawImage 완전 제거 (CSS 배경 사용) ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- AI 추론 (프레임 스킵) ---
            if (handLandmarker && video.currentTime !== lastVideoTime && (timestamp - lastInferenceTime > INFERENCE_INTERVAL)) {
                lastVideoTime = video.currentTime;
                lastInferenceTime = timestamp;
                lastInferenceTimestamp = timestamp;

                const results = handLandmarker.detectForVideo(video, timestamp);

                // 이전 프레임 보관 (보간용)
                prevGrabPosList = currGrabPosList.length > 0 ? currGrabPosList : [];

                state.isGrabbing = false;
                const newPosList = [];

                currHandLandmarks = (results && results.landmarks) ? results.landmarks : [];
                if (results && results.landmarks) {
                    for (const landmarks of results.landmarks) {
                        const wrist = landmarks[0];
                        const isFingerFolded = (tipIdx, mcpIdx) => {
                            const tip = landmarks[tipIdx];
                            const mcp = landmarks[mcpIdx];
                            const dtx = tip.x - wrist.x, dty = tip.y - wrist.y;
                            const dmx = mcp.x - wrist.x, dmy = mcp.y - wrist.y;
                            return (dtx * dtx + dty * dty) < (dmx * dmx + dmy * dmy);
                        };
                        const isGrab = isFingerFolded(8,5) && isFingerFolded(12,9) && isFingerFolded(16,13) && isFingerFolded(20,17);
                        const palm = landmarks[9];
                        const px = (1 - palm.x) * canvas.width;
                        const py = palm.y * canvas.height;
                        const grabRadius = Math.max(canvas.width * 0.08, 60);
                        newPosList.push({ x: px, y: py, radius: grabRadius, isGrab });
                        if (isGrab) state.isGrabbing = true;
                    }
                }
                currGrabPosList = newPosList;
                interpT = 0;
            }

            // --- [최적화] 프레임 간 손 위치 선형 보간 (풀 재사용, allocation 없음) ---
            if (lastInferenceTimestamp > 0) {
                interpT = Math.min((timestamp - lastInferenceTimestamp) / INFERENCE_INTERVAL, 1.0);
            }
            const grabPosCount = currGrabPosList.length;
            state.grabPosList.length = 0;
            for (let i = 0; i < grabPosCount; i++) {
                const p = _grabPosPool[i];
                const curr = currGrabPosList[i];
                if (i < prevGrabPosList.length) {
                    const prev = prevGrabPosList[i];
                    p.x = prev.x + (curr.x - prev.x) * interpT;
                    p.y = prev.y + (curr.y - prev.y) * interpT;
                } else {
                    p.x = curr.x;
                    p.y = curr.y;
                }
                p.radius = curr.radius;
                p.isGrab = curr.isGrab;
                state.grabPosList.push(p);
            }

            // 손 스켈레톤 렌더링
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            for (let i = 0; i < currHandLandmarks.length; i++) {
                const isGrab = state.grabPosList[i] ? state.grabPosList[i].isGrab : false;
                drawHandSkeleton(currHandLandmarks[i], isGrab);
            }

            // 게임 로직
            if (state.status === 'PLAYING') {
                if (timestamp - state.lastTick >= 1000) {
                    state.timeLeft--;
                    ui.timerDisp.innerText = state.timeLeft;
                    state.lastTick = timestamp;
                    if (state.timeLeft <= 0) gameOverFunc();
                }

                const blossoms = state.blossoms;
                const grabList = state.grabPosList;
                const grabbing = state.isGrabbing;

                for (let bi = 0; bi < blossoms.length; bi++) {
                    const blossom = blossoms[bi];
                    blossom.update(timestamp);

                    // --- [최적화] 충돌: 거리제곱 비교 (Math.hypot → dx*dx+dy*dy) ---
                    if (grabbing && blossom.active) {
                        for (let gi = 0; gi < grabList.length; gi++) {
                            const pos = grabList[gi];
                            if (!pos.isGrab) continue;
                            const dx = pos.x - blossom.x;
                            const dy = pos.y - blossom.y;
                            const threshold = pos.radius + blossom.size;
                            if (dx * dx + dy * dy < threshold * threshold) {
                                blossom.active = false;
                                const pts = blossom.isSpecial ? 100 : 10;
                                state.score += pts;
                                ui.scoreDisp.innerText = state.score;
                                playCatchSound();
                                state.particles.push(new Particle(
                                    blossom.x, blossom.y,
                                    blossom.isSpecial ? plusHundredCache : plusTenCache
                                ));
                                setTimeout(() => { blossom.reset(); }, 500);
                                break;
                            }
                        }
                    }
                }
            } else if (state.status === 'MENU' || state.status === 'GAMEOVER') {
                for (let i = 0; i < state.blossoms.length; i++) state.blossoms[i].update(timestamp);
            }

            // 드로우
            for (let i = 0; i < state.blossoms.length; i++) state.blossoms[i].draw(ctx, timestamp);
            // --- [최적화] 벚꽃 루프 종료 후 transform 일괄 리셋 (루프 내 리셋 제거) ---
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.update();
                p.draw(ctx);
                // --- [최적화] splice 제거 → swap-with-last O(1) 삭제 ---
                if (p.life <= 0) {
                    state.particles[i] = state.particles[state.particles.length - 1];
                    state.particles.length--;
                }
            }
        };

        // 이벤트
        ui.btnStart.addEventListener('click', startGame);
        ui.btnRestart.addEventListener('click', startGame);

        ui.btnSubmit.addEventListener('click', async () => {
            const name = ui.nameInput.value.trim();
            if (!name) { alert("이름을 입력해주세요."); return; }
            if (state.score === 0) { alert("점수가 0점이라 등록할 수 없습니다."); return; }
            ui.btnSubmit.disabled = true;
            ui.btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            ui.btnSubmit.innerText = "등록 중...";
            const success = await saveScoreToFirebase(name, state.score);
            if (success) {
                ui.submitMsg.classList.remove('hidden');
                ui.btnSubmit.innerText = "등록 완료";
            } else {
                alert("점수 등록에 실패했습니다.");
                ui.btnSubmit.disabled = false;
                ui.btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
                ui.btnSubmit.innerText = "등록";
            }
        });

        // 초기화
        const initApp = async () => {
            resizeCanvas();
            await Promise.all([initFirebase(), startCamera(), initMediaPipe()]);
            changeState('MENU');
            gameLoop(performance.now());
        };
        window.onload = initApp;
    </script>
</body>
</html>
