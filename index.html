<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>잡기 게임 — 음식 / 전통물건</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #b8d4f0; touch-action: none; }
        /* 비디오를 CSS 배경으로 깔아 drawImage 제거 */
        #video {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 0;
        }
        #gameCanvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }
        .glass-panel { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); }
        .pink-glow { text-shadow: 0 0 10px #ffb7c5, 0 0 20px #ffb7c5; }
        /* 테마 선택 버튼 */
        .theme-btn {
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.07);
            transition: all .15s ease;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.16); }
        .theme-btn.selected {
            border-color: var(--theme-accent, #ffe066);
            background: rgba(255,255,255,0.18);
            box-shadow: 0 0 14px var(--theme-accent, #ffe066);
        }
    </style>
</head>
<body class="relative text-white font-sans">
    <video id="video" autoplay playsinline></video>
    <canvas id="gameCanvas"></canvas>

    <!-- 인게임 HUD -->
    <div id="hud" class="fixed top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none hidden z-10">
        <div class="flex flex-col">
            <span class="text-xl text-pink-300 font-bold">점수</span>
            <span id="scoreDisplay" class="text-5xl font-extrabold pink-glow">0</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-xl text-pink-300 font-bold">남은 시간</span>
            <span id="timerDisplay" class="text-5xl font-extrabold">30</span>
        </div>
    </div>

    <!-- 로딩 화면 -->
    <div id="loadingScreen" class="fixed inset-0 flex flex-col items-center justify-center z-50" style="background-color:#b8d4f0">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-pink-400 mb-4"></div>
        <h2 class="text-2xl font-bold text-pink-300">카메라 및 AI 모델 로딩 중...</h2>
        <p class="text-gray-400 mt-2">최적화 모드로 준비 중입니다.</p>
    </div>

    <!-- 메인 메뉴 -->
    <div id="menuScreen" class="fixed inset-0 flex flex-col items-center justify-start z-40 glass-panel hidden overflow-y-auto py-8 px-4">
        <h1 id="menuTitle" class="text-5xl sm:text-6xl font-extrabold text-yellow-400 mb-4 text-center" style="text-shadow:0 0 10px #ffe066,0 0 20px #ffe066">🍕 음식 잡기 🍔</h1>

        <!-- 테마 선택 -->
        <div class="flex gap-3 mb-5">
            <button data-theme="food" class="theme-btn px-5 py-3 rounded-xl text-lg font-bold">🍕 음식 잡기</button>
            <button data-theme="korea" class="theme-btn px-5 py-3 rounded-xl text-lg font-bold">전통물건 잡기</button>
        </div>

        <p id="menuDesc" class="text-lg mb-5 text-center max-w-lg text-gray-200"></p>

        <!-- 아이템 범례 (오답이 있는 테마에서만 노출) -->
        <div id="legendBox" class="hidden w-full max-w-lg bg-black bg-opacity-40 rounded-xl p-4 mb-6 border border-gray-700">
            <p class="text-sm font-bold text-green-300 mb-2">✅ 이것만 잡으세요 (전통물건)</p>
            <div id="legendGood" class="grid grid-cols-5 justify-items-center gap-1 mb-4"></div>
            <p class="text-sm font-bold text-red-300 mb-2">❌ 이건 잡으면 감점 (요즘 물건)</p>
            <div id="legendBad" class="grid grid-cols-4 justify-items-center gap-1"></div>
        </div>

        <button id="startBtn" class="px-8 py-4 bg-pink-500 hover:bg-pink-600 rounded-full text-2xl font-bold transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(236,72,153,0.5)] mb-8">
            게임 시작
        </button>
        <div class="w-full max-w-sm bg-gray-800 bg-opacity-80 rounded-xl p-6 border border-pink-900 shadow-xl">
            <h2 id="menuLbTitle" class="text-2xl font-bold text-center text-pink-300 mb-4 border-b border-pink-800 pb-2">🏆 명예의 전당 (Top 5)</h2>
            <ul id="menuLeaderboard" class="space-y-2">
                <li class="text-center text-gray-400">데이터를 불러오는 중...</li>
            </ul>
        </div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameOverScreen" class="fixed inset-0 flex flex-col items-center justify-center z-40 glass-panel hidden overflow-y-auto">
        <h1 class="text-5xl font-extrabold text-red-400 mb-2">TIME OVER</h1>
        <div class="text-2xl mb-6">최종 점수: <span id="finalScore" class="text-5xl font-bold text-pink-400 pink-glow ml-2">0</span></div>
        <div id="nameInputSection" class="flex flex-col items-center mb-8">
            <p class="mb-2 text-pink-200">순위표에 등록할 이름을 입력하세요</p>
            <div class="flex">
                <input type="text" id="playerName" placeholder="닉네임 (최대 8자)" maxlength="8" class="px-4 py-3 rounded-l-lg bg-gray-700 text-white border-none focus:ring-2 focus:ring-pink-500 outline-none w-48">
                <button id="submitScoreBtn" class="px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-r-lg font-bold transition-colors">등록</button>
            </div>
            <p id="submitMsg" class="text-sm mt-2 text-green-400 hidden">점수가 등록되었습니다!</p>
        </div>
        <div class="w-full max-w-sm bg-gray-800 bg-opacity-80 rounded-xl p-6 border border-pink-900 shadow-xl mb-6">
            <h2 id="gameOverLbTitle" class="text-2xl font-bold text-center text-pink-300 mb-4 border-b border-pink-800 pb-2">🏆 명예의 전당</h2>
            <ul id="gameOverLeaderboard" class="space-y-2"></ul>
        </div>
        <button id="restartBtn" class="px-8 py-3 bg-gray-600 hover:bg-gray-500 rounded-full text-xl font-bold transition-colors shadow-lg">
            다시 시작하기
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

        // ==========================================
        // Firebase (순위표)
        // ==========================================
        let db, auth, currentUser;
        let useLocalStorage = false;

        // localStorage 기반 리더보드 (Firebase 미설정 시 폴백)
        // 테마마다 규칙이 달라 점수를 비교할 수 없으므로 순위표를 테마별로 분리한다.
        // 'food'는 기존 키를 그대로 써서 이미 쌓인 점수를 유지한다.
        const LS_KEY = 'cherry_blossom_leaderboard';
        const lsKeyFor = (themeId) => themeId === 'food' ? LS_KEY : `${LS_KEY}_${themeId}`;
        const getLocalScores = (themeId) => {
            try { return JSON.parse(localStorage.getItem(lsKeyFor(themeId)) || '[]'); }
            catch { return []; }
        };
        const saveLocalScore = (themeId, name, score) => {
            const scores = getLocalScores(themeId);
            scores.push({ name, score, timestamp: Date.now() });
            scores.sort((a, b) => b.score - a.score);
            localStorage.setItem(lsKeyFor(themeId), JSON.stringify(scores.slice(0, 5)));
        };

        const initFirebase = async () => {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cherry-blossom-game';
                if (!firebaseConfig) {
                    console.warn("Firebase config not found. localStorage 리더보드로 전환합니다.");
                    useLocalStorage = true;
                    renderLeaderboard();
                    return null;
                }
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                return new Promise((resolve) => {
                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) setupLeaderboard(appId);
                        resolve(user);
                    });
                });
            } catch (e) { console.error("Firebase init error:", e); }
        };

        // 모든 테마의 점수를 그대로 담아두고, 렌더 시점에 현재 테마로 필터링한다.
        let allScores = [];
        const setupLeaderboard = (appId) => {
            if (!currentUser || !db) return;
            const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            onSnapshot(scoresRef, (snapshot) => {
                allScores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLeaderboard();
            }, (error) => console.error("Leaderboard fetch error:", error));
        };

        // theme 필드가 없는 기존 문서는 음식 테마 시절의 점수이므로 'food'로 간주한다.
        const currentTopScores = () => {
            const themeId = state.themeId;
            if (useLocalStorage) return getLocalScores(themeId).slice(0, 5);
            return allScores
                .filter(s => (s.theme || 'food') === themeId)
                .sort((a, b) => b.score - a.score)
                .slice(0, 5);
        };

        const renderLeaderboard = () => {
            const scores = currentTopScores();
            const html = scores.length === 0
                ? `<li class="text-center text-gray-400">아직 등록된 점수가 없습니다.</li>`
                : scores.map((s, i) => {
                    const colors = ['text-yellow-400','text-gray-300','text-amber-600','text-white','text-white'];
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                    return `<li class="flex justify-between items-center bg-gray-700 bg-opacity-50 px-4 py-2 rounded">
                        <span class="font-bold ${colors[i]}">${medal} ${s.name}</span>
                        <span class="font-bold text-pink-300">${s.score}점</span></li>`;
                }).join('');
            document.getElementById('menuLeaderboard').innerHTML = html;
            document.getElementById('gameOverLeaderboard').innerHTML = html;

            const label = `🏆 명예의 전당 · ${THEMES[state.themeId].shortName}`;
            document.getElementById('menuLbTitle').innerText = `${label} (Top 5)`;
            document.getElementById('gameOverLbTitle').innerText = label;
        };

        const saveScoreToFirebase = async (name, score) => {
            if (score <= 0) return false;
            const themeId = state.themeId;
            if (useLocalStorage) {
                saveLocalScore(themeId, name || "무명", score);
                renderLeaderboard();
                return true;
            }
            if (!currentUser || !db) return false;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cherry-blossom-game';
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard'), {
                    name: name || "무명", score, theme: themeId, uid: currentUser.uid, timestamp: serverTimestamp()
                });
                return true;
            } catch (e) { console.error("Score save error:", e); return false; }
        };

        // ==========================================
        // 게임 코어
        // ==========================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 오답(모던 아이템)을 잡았을 때의 감점
        const PENALTY = 15;

        // --- [최적화] 아이템 스프라이트 사전 렌더링 캐시 ---
        const BLOSSOM_CACHE_SIZE = 64;

        const makeEmojiCache = (emoji) => {
            const c = document.createElement('canvas');
            c.width = BLOSSOM_CACHE_SIZE;
            c.height = BLOSSOM_CACHE_SIZE;
            const cx = c.getContext('2d');
            cx.font = `${BLOSSOM_CACHE_SIZE - 8}px Arial`;
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            cx.fillText(emoji, BLOSSOM_CACHE_SIZE / 2, BLOSSOM_CACHE_SIZE / 2);
            return c;
        };

        // 코드로 그린 스프라이트도 결국 같은 크기의 캔버스 한 장이 되므로
        // 매 프레임 비용은 이모지 캐시와 완전히 동일하다.
        const makeDrawnCache = (drawFn) => {
            const c = document.createElement('canvas');
            c.width = BLOSSOM_CACHE_SIZE;
            c.height = BLOSSOM_CACHE_SIZE;
            const cx = c.getContext('2d');
            cx.lineJoin = 'round';
            cx.lineCap = 'round';
            try { drawFn(cx, BLOSSOM_CACHE_SIZE); }
            catch (e) { console.error('아이템 드로잉 실패:', e); }
            return c;
        };

        // 점수 파티클(“+10 갓”, “-15 스마트폰”) 캐시. 폭은 글자 길이에 맞춰 잰다.
        const SCORE_FONT = 'bold 22px Arial, "Malgun Gothic", sans-serif';
        const makeScoreCache = (text, fill) => {
            const c = document.createElement('canvas');
            let cx = c.getContext('2d');
            cx.font = SCORE_FONT;
            const w = Math.ceil(cx.measureText(text).width) + 14;
            c.width = w; c.height = 32;      // 크기 변경은 컨텍스트 상태를 초기화한다
            cx = c.getContext('2d');
            cx.font = SCORE_FONT;
            cx.textAlign = 'center';
            cx.textBaseline = 'middle';
            cx.lineWidth = 4;
            cx.lineJoin = 'round';
            cx.strokeStyle = 'rgba(0,0,0,0.8)';
            cx.strokeText(text, w / 2, 16);  // 웹캠 영상 위에서도 읽히도록 검은 외곽선
            cx.fillStyle = fill;
            cx.fillText(text, w / 2, 16);
            return c;
        };

        // "+10" 파티클 캐시
        const plusTenCache = document.createElement('canvas');
        plusTenCache.width = 56; plusTenCache.height = 32;
        const pCacheCtx = plusTenCache.getContext('2d');
        pCacheCtx.fillStyle = "#ffe066";
        pCacheCtx.font = "bold 24px Arial";
        pCacheCtx.textAlign = "center";
        pCacheCtx.textBaseline = "middle";
        pCacheCtx.fillText("+10", 28, 16);

        // "+100" 파티클 캐시 (황금)
        const plusHundredCache = document.createElement('canvas');
        plusHundredCache.width = 80; plusHundredCache.height = 36;
        const phCtx = plusHundredCache.getContext('2d');
        phCtx.fillStyle = "#ff4444";
        phCtx.font = "bold 28px Arial";
        phCtx.textAlign = "center";
        phCtx.textBaseline = "middle";
        phCtx.fillText("+100", 40, 18);

        // 특별 아이템 황금 글로우 캐시
        const specialGlowCache = document.createElement('canvas');
        specialGlowCache.width = 128; specialGlowCache.height = 128;
        const sgCtx = specialGlowCache.getContext('2d');
        const sg = sgCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
        sg.addColorStop(0,   'rgba(255, 220, 0, 0.85)');
        sg.addColorStop(0.4, 'rgba(255, 160, 0, 0.45)');
        sg.addColorStop(1,   'rgba(255, 100, 0, 0)');
        sgCtx.fillStyle = sg;
        sgCtx.fillRect(0, 0, 128, 128);

        // "⭐100" 뱃지 캐시 (아이템 위에 표시)
        const hundredBadgeCache = document.createElement('canvas');
        hundredBadgeCache.width = 64; hundredBadgeCache.height = 24;
        const hbCtx = hundredBadgeCache.getContext('2d');
        hbCtx.fillStyle = "rgba(200, 0, 0, 0.88)";
        hbCtx.fillRect(0, 0, 64, 24);
        hbCtx.fillStyle = "#ffffff";
        hbCtx.font = "bold 14px Arial";
        hbCtx.textAlign = "center";
        hbCtx.textBaseline = "middle";
        hbCtx.fillText("⭐ 100", 32, 12);

        // --- [최적화] 글로우용 그라디언트 캐시 ---
        // 크기가 달라질 수 있으므로 createRadialGradient를 직접 캐시하긴 어렵지만
        // 고정 크기 글로우 이미지를 만들어 스케일링으로 사용
        const GLOW_SIZE = 128;
        const grabGlowCache = document.createElement('canvas');
        grabGlowCache.width = GLOW_SIZE;
        grabGlowCache.height = GLOW_SIZE;
        const gGCtx = grabGlowCache.getContext('2d');
        const gg = gGCtx.createRadialGradient(GLOW_SIZE/2, GLOW_SIZE/2, 0, GLOW_SIZE/2, GLOW_SIZE/2, GLOW_SIZE/2);
        gg.addColorStop(0, 'rgba(0, 255, 100, 0.5)');
        gg.addColorStop(0.7, 'rgba(0, 255, 100, 0.2)');
        gg.addColorStop(1, 'rgba(0, 255, 100, 0)');
        gGCtx.fillStyle = gg;
        gGCtx.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);

        const openGlowCache = document.createElement('canvas');
        openGlowCache.width = GLOW_SIZE;
        openGlowCache.height = GLOW_SIZE;
        const oGCtx = openGlowCache.getContext('2d');
        const og = oGCtx.createRadialGradient(GLOW_SIZE/2, GLOW_SIZE/2, 0, GLOW_SIZE/2, GLOW_SIZE/2, GLOW_SIZE/2);
        og.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
        og.addColorStop(1, 'rgba(255, 255, 255, 0)');
        oGCtx.fillStyle = og;
        oGCtx.fillRect(0, 0, GLOW_SIZE, GLOW_SIZE);

        // 오디오
        let audioCtx;
        const initAudio = () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        };
        const playCatchSound = () => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        };

        // 오답(모던 아이템)을 잡았을 때 — 아래로 떨어지는 낮은 소리
        const playMissSound = () => {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(320, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.28);
            gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        };

        // 배경음악 (Web Audio API, 8비트 스타일 신나는 루프)
        let bgmActive = false;
        let bgmMasterGain = null;

        // 16분음표 단위 멜로디 (주파수Hz, 박자수)
        // 120BPM → 16분음표 = 0.125초
        const BGM_BEAT = 0.125;
        const BGM_MELODY = [
            [659.25,2],[783.99,2],[1046.5,2],[783.99,2],
            [659.25,2],[523.25,2],[587.33,4],
            [587.33,2],[659.25,2],[783.99,2],[880.00,2],
            [783.99,2],[659.25,2],[523.25,4],
            [880.00,2],[880.00,2],[1046.5,2],[880.00,2],
            [783.99,2],[659.25,2],[523.25,4],
            [659.25,2],[587.33,2],[523.25,2],[440.00,2],
            [493.88,2],[523.25,2],[659.25,8],
        ];
        const BGM_BASS = [
            [130.81,8],[146.83,8],[174.61,8],[130.81,8],
            [130.81,8],[174.61,8],[196.00,8],[130.81,8],
        ];

        // 전통 테마용 5음계(계면조) 멜로디 — 라·도·레·미·솔만 사용해 국악 느낌을 낸다.
        const BGM_MELODY_KOREA = [
            [440.00,4],[523.25,2],[587.33,2],[659.25,4],[587.33,4],
            [523.25,4],[440.00,4],[392.00,8],
            [440.00,4],[659.25,2],[783.99,2],[880.00,4],[783.99,4],
            [659.25,4],[587.33,4],[523.25,8],
            [880.00,4],[783.99,2],[659.25,2],[587.33,4],[659.25,4],
            [523.25,4],[440.00,4],[392.00,8],
            [440.00,2],[523.25,2],[587.33,2],[659.25,2],[783.99,4],[659.25,4],
            [587.33,4],[523.25,4],[440.00,8],
        ];
        const BGM_BASS_KOREA = [

                const g = audioCtx.createGain();

                g.gain.setValueAtTime(0.4, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.85);
                osc.connect(g);
                g.connect(gain);
                osc.start(t);

                t += dur;

            return t; // 루프 끝 시간 반환

            bgmMasterGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.5);

            const bassLen   = bgm.bass.reduce((s,[,b]) => s + b * BGM_BEAT, 0);
            const loopLen   = Math.max(melodyLen, bassLen);

                if (!bgmActive) return;
                scheduleTrack(bgm.melody, startTime, bgmMasterGain, bgm.wave);
                scheduleTrack(bgm.bass,   startTime, bgmMasterGain, 'square');

                const g = cx.createLinearGradient(x0, y0, x0 + w, y0 + h);
                g.addColorStop(0, '#2c3c69'); g.addColorStop(1, '#0b0f20');
                cx.fillStyle = g; cx.fill();
                cx.strokeStyle = FR; cx.lineWidth = S*0.05; cx.stroke();
                // 유리 사선 하이라이트
                cx.save(); cx.clip();
                cx.strokeStyle = 'rgba(255,255,255,0.45)'; cx.lineWidth = S*0.045;
                cx.beginPath(); cx.moveTo(x0 + w*0.06, y0 + h*0.98); cx.lineTo(x0 + w*0.52, y0 + h*0.02); cx.stroke();
                cx.strokeStyle = 'rgba(255,255,255,0.28)'; cx.lineWidth = S*0.022;
                cx.beginPath(); cx.moveTo(x0 + w*0.44, y0 + h*0.98); cx.lineTo(x0 + w*0.90, y0 + h*0.02); cx.stroke();
                cx.restore();
              }
              cx.restore();
            },
        };

        // ==========================================
        // 테마 정의
        // ==========================================
        const TRADITIONAL_DEFS = [

        const buildDrawnItems = (defs, good) => defs.map(([key, name]) => ({

        const THEMES = {

                title: '전통물건 잡기',

                desc: `<b style="color:#7ee2a8">전통물건</b>만 골라 잡으세요! 손을 폈다가 <b style="color:#ffe066">주먹을 쥘 때마다 한 개씩</b> 잡힙니다.<br>스마트폰·햄버거 같은 <b style="color:#ff8d8d">요즘 물건을 잡으면 -${PENALTY}점</b>입니다.`,
                goods: buildDrawnItems(TRADITIONAL_DEFS, true),

        // UI
        const ui = {

        let handLandmarker;
        let lastVideoTime = -1;

        // --- [최적화] AI 추론 주기 확대 (100ms → 150ms, ~7FPS 추적) ---
        let lastInferenceTime = 0;

        // --- [최적화] 손 위치 보간용 데이터 ---
        let prevGrabPosList = [];
        let currGrabPosList = [];
        let interpT = 0;
        let lastInferenceTimestamp = 0;

        // --- [최적화] 프레임 레이트 상한 (60fps) ---
        let lastFrameTime = 0;
        const FRAME_CAP_MS = 1000 / 60;

        // --- [최적화] grabPos 객체 풀 (매 프레임 allocation 방지) ---
        const _grabPosPool = [
            {x:0, y:0, radius:0, isGrab:false},
            {x:0, y:0, radius:0, isGrab:false}
        ];

        // 겨냥이 필요한 테마에서 "주먹을 쥔 순간"에만 한 번 판정하기 위한 손별 상태.
        // 이게 없으면 주먹을 쥐고 있는 동안 매 프레임 한 개씩 계속 빨려 들어간다.
        const handArmed = [true, true];

        const GAME_DURATION = 30;
        let state = {
            status: 'LOADING',
            themeId: 'food',
            score: 0,
            timeLeft: GAME_DURATION,
            lastTick: 0,
            blossoms: [],
            particles: [],
            isGrabbing: false,

            hitFlash: 0        // 오답을 잡았을 때의 붉은 화면 플래시 (1 → 0으로 감쇠)
        };
        const theme = () => THEMES[state.themeId];

        // --- [최적화] 벚꽃 개수 제한 (최대 120개) ---
        class Blossom {
            constructor() { this.reset(); this.y = Math.random() * canvas.height; }
            reset() {
                const t = theme();
                // 오답 비율만큼 모던 아이템을 섞는다 (음식 테마는 decoyRatio 0이라 항상 정답)
                const useDecoy = t.decoyRatio > 0 && Math.random() < t.decoyRatio;
                const pool = useDecoy ? t.decoys : t.goods;
                const item = pool[Math.floor(Math.random() * pool.length)];

                this.item = item;
                this.good = item.good;
                this.cache = item.cache;

                this.x = Math.random() * canvas.width;
                this.y = -50;
                this.swaySpeed = Math.random() * 0.05 + 0.02;
                this.swayAmount = Math.random() * 50 + 20;
                this.seed = Math.random() * 100;
                this.spin = t.spin;
                this.rotation = t.spin ? Math.random() * Math.PI * 2 : 0;
                this.rotSpeed = t.spin ? (Math.random() - 0.5) * 0.1 : 0;
                this.active = true;
                // 100점짜리 특별 아이템은 정답에만 붙는다
                this.isSpecial = this.good && Math.random() < t.specialChance;
                this.size = (Math.random() * t.sizeVar + t.sizeMin) * (this.isSpecial ? 1.5 : 1);
                this.speed = (Math.random() * t.speedVar + t.speedMin) * (this.isSpecial ? 0.75 : 1); // 특별 아이템은 천천히
                // --- [최적화] 드로우 크기 사전 계산 (매 프레임 나눗셈 제거) ---
                const _s = this.size / (BLOSSOM_CACHE_SIZE - 8);
                this.drawSize = BLOSSOM_CACHE_SIZE * _s;
                this.halfSize = this.drawSize * 0.5;
            }
            update(time) {
                if (!this.active) return;
                this.y += this.speed;
                this.x += Math.sin(time * this.swaySpeed + this.seed) * 2;
                // 뭘 잡을지 판단해야 하는 테마에서는 빙글빙글 돌면 알아보기 어렵다.
                // 대신 좌우로 아주 느리게 기우뚱거리게만 한다.
                // (swaySpeed를 그대로 쓰면 초당 3~11회 떠는 꼴이 되므로 크게 낮춘다)
                this.rotation = this.spin
                    ? this.rotation + this.rotSpeed
                    : Math.sin(time * this.swaySpeed * 0.02 + this.seed) * 0.2;
                if (this.y > canvas.height + 50) this.reset();
            }
            draw(ctx, timestamp) {
                if (!this.active) return;
                const cos = Math.cos(this.rotation);
                const sin = Math.sin(this.rotation);

                if (this.isSpecial) {
                    // 황금 글로우 (화면 기준 고정, 맥동 효과)
                    const pulse = 1 + 0.25 * Math.sin(timestamp * 0.005);
                    const glowSize = this.drawSize * 2.8 * pulse;
                    ctx.setTransform(1, 0, 0, 1, this.x, this.y);
                    ctx.drawImage(specialGlowCache, -glowSize / 2, -glowSize / 2, glowSize, glowSize);
                }

                // 아이템 스프라이트 (회전/기울기 적용)
                ctx.setTransform(cos, sin, -sin, cos, this.x, this.y);
                ctx.drawImage(this.cache, -this.halfSize, -this.halfSize, this.drawSize, this.drawSize);

                if (this.isSpecial) {
                    // "⭐100" 뱃지 (항상 똑바로)
                    ctx.setTransform(1, 0, 0, 1, this.x, this.y);
                    ctx.drawImage(hundredBadgeCache, -32, -this.halfSize - 26);
                }
            }
        }

        // --- [최적화] 파티클도 캐시 이미지 사용 ---
        class Particle {
            constructor(x, y, cache, dy = -2) {
                this.x = x; this.y = y; this.life = 1.0;
                this.dy = dy;
                this.cache = cache;
            }
            update() { this.y += this.dy; this.life -= 0.03; }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.globalAlpha = this.life;
                ctx.drawImage(this.cache, this.x - this.cache.width / 2, this.y - this.cache.height / 2);
                ctx.globalAlpha = 1;
            }
        }

        // 낙하물 개수는 테마마다 다르다 (음식은 쓸어담기용으로 촘촘하게, 전통물건은 겨냥용으로 성기게)
        const rebuildBlossoms = () => {
            const t = theme();
            const count = Math.max(
                t.minCount,
                Math.min(Math.floor((canvas.width * canvas.height) / t.density), t.maxCount)
            );
            state.blossoms.length = 0;
            for (let i = 0; i < count; i++) state.blossoms.push(new Blossom());
        };

        const resizeCanvas = () => {
            canvas.width = window.innerWidth;

        // 범례용 썸네일 — 아이템 캐시를 그대로 이미지로 바꿔 쓴다 (아이템당 한 번만 계산)
        const legendChip = (item) => {
            if (!item.dataURL) item.dataURL = item.cache.toDataURL();
            return `<div class="flex flex-col items-center w-[62px] mb-1">

        const applyTheme = (themeId) => {
            if (!THEMES[themeId]) return;

            ui.menuTitle.innerText = t.title;

            // 뭘 잡아야 하는지 모르면 감점이 그냥 운이 되므로, 오답이 있는 테마는 범례를 보여준다.
            if (t.decoys.length > 0) {

        const startCamera = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
                });
                video.srcObject = stream;

            } catch (err) {
                alert("카메라 접근 권한이 필요합니다!");

        };

        const initMediaPipe = async () => {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });
        };

        const changeState = (newState) => {
            state.status = newState;
            ui.loading.classList.add('hidden');
            ui.menu.classList.add('hidden');
            ui.hud.classList.add('hidden');

            if (newState === 'PLAYING') ui.hud.classList.remove('hidden');
            if (newState === 'GAMEOVER') ui.gameOver.classList.remove('hidden');
        };

        const startGame = () => {
            initAudio();

        const gameOverFunc = () => {
            stopBGM();
            changeState('GAMEOVER');
            ui.finalScoreDisp.innerText = state.score;
        };

        // lerpPos 제거 — 인라인 풀 방식으로 대체

        // 스켈레톤 렌더링용 랜드마크 저장
        let currHandLandmarks = [];

        // MediaPipe 손 연결 인덱스
        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],         // 엄지
            [0,5],[5,6],[6,7],[7,8],          // 검지
            [0,9],[9,10],[10,11],[11,12],     // 중지
            [0,13],[13,14],[14,15],[15,16],   // 약지
            [0,17],[17,18],[18,19],[19,20],   // 새끼
            [5,9],[9,13],[13,17]              // 손바닥
        ];

        const drawHandSkeleton = (landmarks, isGrab) => {
            const lineColor = isGrab ? 'rgba(80,255,160,0.9)' : 'rgba(255,255,255,0.85)';
            const jointColor = isGrab ? '#50ffa0' : '#ffffff';
            const tipColor   = isGrab ? '#ffff66' : '#aaddff';

            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (const [a, b] of HAND_CONNECTIONS) {
                ctx.moveTo((1 - landmarks[a].x) * canvas.width, landmarks[a].y * canvas.height);
                ctx.lineTo((1 - landmarks[b].x) * canvas.width, landmarks[b].y * canvas.height);
            }
            ctx.stroke();

            // 관절
            ctx.fillStyle = jointColor;
            for (let i = 0; i < landmarks.length; i++) {
                const lm = landmarks[i];
                ctx.beginPath();
                ctx.arc((1 - lm.x) * canvas.width, lm.y * canvas.height, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 손가락 끝 (더 크게, 다른 색)
            ctx.fillStyle = tipColor;
            for (const tip of [4, 8, 12, 16, 20]) {
                ctx.beginPath();
                ctx.arc((1 - landmarks[tip].x) * canvas.width, landmarks[tip].y * canvas.height, 7, 0, Math.PI * 2);
                ctx.fill();
            }
        };

        // 아이템 하나를 잡았을 때의 처리 (정답/오답 공통 진입점)
        const catchBlossom = (b) => {
            b.active = false;
            if (b.good) {
                state.score += b.isSpecial ? 100 : 10;
                playCatchSound();
                state.particles.push(new Particle(
                    b.x, b.y,
                    b.isSpecial ? b.item.specialHitCache : b.item.hitCache,
                    b.isSpecial ? -3 : -2
                ));
            } else {
                state.score = Math.max(0, state.score - PENALTY);   // 0점 밑으로는 내려가지 않는다
                playMissSound();
                state.hitFlash = 1;
                state.particles.push(new Particle(b.x, b.y, b.item.hitCache, -2));
            }
            ui.scoreDisp.innerText = state.score;
            setTimeout(() => { b.reset(); }, 500);
        };

        // ==========================================
        // 메인 루프
        // ==========================================
        const gameLoop = (timestamp) => {
            animationFrameId = requestAnimationFrame(gameLoop);
            // --- [최적화] 프레임 레이트 상한 (120Hz+ 디바이스 대응) ---
            if (timestamp - lastFrameTime < FRAME_CAP_MS) return;
            lastFrameTime = timestamp;

            // --- [최적화] 비디오 drawImage 완전 제거 (CSS 배경 사용) ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- AI 추론 (프레임 스킵) ---
            if (handLandmarker && video.currentTime !== lastVideoTime && (timestamp - lastInferenceTime > INFERENCE_INTERVAL)) {
                lastVideoTime = video.currentTime;
                lastInferenceTime = timestamp;
                lastInferenceTimestamp = timestamp;

                const results = handLandmarker.detectForVideo(video, timestamp);

                // 이전 프레임 보관 (보간용)
                prevGrabPosList = currGrabPosList.length > 0 ? currGrabPosList : [];

                state.isGrabbing = false;
                const newPosList = [];

                currHandLandmarks = (results && results.landmarks) ? results.landmarks : [];
                if (results && results.landmarks) {
                    for (const landmarks of results.landmarks) {
                        const wrist = landmarks[0];
                        const isFingerFolded = (tipIdx, mcpIdx) => {
                            const tip = landmarks[tipIdx];
                            const mcp = landmarks[mcpIdx];
                            const dtx = tip.x - wrist.x, dty = tip.y - wrist.y;
                            const dmx = mcp.x - wrist.x, dmy = mcp.y - wrist.y;
                            return (dtx * dtx + dty * dty) < (dmx * dmx + dmy * dmy);
                        };
                        const isGrab = isFingerFolded(8,5) && isFingerFolded(12,9) && isFingerFolded(16,13) && isFingerFolded(20,17);
                        const palm = landmarks[9];
                        const px = (1 - palm.x) * canvas.width;
                        const py = palm.y * canvas.height;
                        const grabRadius = Math.max(canvas.width * 0.08, 60);
                        newPosList.push({ x: px, y: py, radius: grabRadius, isGrab });
                        if (isGrab) state.isGrabbing = true;
                    }
                }
                currGrabPosList = newPosList;
                interpT = 0;
            }

            // --- [최적화] 프레임 간 손 위치 선형 보간 (풀 재사용, allocation 없음) ---
            if (lastInferenceTimestamp > 0) {
                interpT = Math.min((timestamp - lastInferenceTimestamp) / INFERENCE_INTERVAL, 1.0);
            }
            const grabPosCount = currGrabPosList.length;
            // 인식되지 않는 손은 다음에 나타날 때 바로 잡을 수 있도록 장전 상태로 되돌린다
            for (let i = grabPosCount; i < handArmed.length; i++) handArmed[i] = true;
            state.grabPosList.length = 0;
            for (let i = 0; i < grabPosCount; i++) {
                const p = _grabPosPool[i];
                const curr = currGrabPosList[i];
                if (i < prevGrabPosList.length) {
                    const prev = prevGrabPosList[i];
                    p.x = prev.x + (curr.x - prev.x) * interpT;
                    p.y = prev.y + (curr.y - prev.y) * interpT;
                } else {
                    p.x = curr.x;
                    p.y = curr.y;
                }
                p.radius = curr.radius;
                p.isGrab = curr.isGrab;
                state.grabPosList.push(p);
                // 손을 편 손은 다시 장전한다.
                // isGrabbing 블록 안에서 하면 손을 폈을 때 실행되지 않으므로 반드시 여기서 한다.
                if (!p.isGrab) handArmed[i] = true;
            }

            // 손 스켈레톤 렌더링
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            for (let i = 0; i < currHandLandmarks.length; i++) {
                const isGrab = state.grabPosList[i] ? state.grabPosList[i].isGrab : false;
                drawHandSkeleton(currHandLandmarks[i], isGrab);
            }

            // 게임 로직
            if (state.status === 'PLAYING') {
                if (timestamp - state.lastTick >= 1000) {
                    state.timeLeft--;
                    ui.timerDisp.innerText = state.timeLeft;
                    state.lastTick = timestamp;
                    if (state.timeLeft <= 0) gameOverFunc();
                }

                const blossoms = state.blossoms;
                const grabList = state.grabPosList;

                for (let bi = 0; bi < blossoms.length; bi++) blossoms[bi].update(timestamp);

                // --- [최적화] 충돌: 거리제곱 비교 (Math.hypot → dx*dx+dy*dy) ---
                if (state.isGrabbing) {
                    if (theme().preciseCatch) {
                        // 오답이 섞인 테마: 주먹 하나당 반경 안에서 "가장 가까운 한 개"만 잡는다.
                        // 쓸어담게 두면 정답과 오답이 동시에 잡혀 겨냥이 무의미해진다.
                        const pad = theme().catchPad;
                        for (let gi = 0; gi < grabList.length; gi++) {
                            const pos = grabList[gi];
                            if (!pos.isGrab) continue;
                            // 주먹을 쥐고 있는 동안 판정은 딱 한 번. 다시 잡으려면 손을 폈다 쥐어야 한다.
                            // (빗나가도 장전을 소모한다 — 안 그러면 쥔 채로 기다렸다가 주워담게 된다)
                            if (!handArmed[gi]) continue;
                            handArmed[gi] = false;

                            let bestIdx = -1, bestDist = Infinity;
                            for (let bi = 0; bi < blossoms.length; bi++) {
                                const b = blossoms[bi];
                                if (!b.active) continue;
                                const dx = pos.x - b.x;
                                const dy = pos.y - b.y;
                                const d2 = dx * dx + dy * dy;
                                // 눈에 보이는 반지름 + 여유. 화면 크기와 무관하게 일정하다.
                                const threshold = b.halfSize + pad;
                                if (d2 < threshold * threshold && d2 < bestDist) {
                                    bestDist = d2;
                                    bestIdx = bi;
                                }
                            }
                            if (bestIdx >= 0) catchBlossom(blossoms[bestIdx]);
                        }
                    } else {
                        // 전부 정답인 테마: 반경 안의 모든 아이템을 쓸어담는다 (기존 동작)
                        for (let bi = 0; bi < blossoms.length; bi++) {
                            const b = blossoms[bi];
                            if (!b.active) continue;
                            for (let gi = 0; gi < grabList.length; gi++) {
                                const pos = grabList[gi];
                                if (!pos.isGrab) continue;
                                const dx = pos.x - b.x;
                                const dy = pos.y - b.y;
                                const threshold = pos.radius + b.size;
                                if (dx * dx + dy * dy < threshold * threshold) {
                                    catchBlossom(b);
                                    break;
                                }
                            }
                        }
                    }
                }
            } else if (state.status === 'MENU' || state.status === 'GAMEOVER') {
                for (let i = 0; i < state.blossoms.length; i++) state.blossoms[i].update(timestamp);
            }

            // 드로우
            for (let i = 0; i < state.blossoms.length; i++) state.blossoms[i].draw(ctx, timestamp);
            // --- [최적화] 벚꽃 루프 종료 후 transform 일괄 리셋 (루프 내 리셋 제거) ---
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // 오답을 잡았을 때의 붉은 화면 플래시
            if (state.hitFlash > 0) {
                ctx.fillStyle = `rgba(220, 32, 32, ${state.hitFlash * 0.32})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                state.hitFlash = Math.max(0, state.hitFlash - 0.06);
            }

            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.update();
                p.draw(ctx);
                // --- [최적화] splice 제거 → swap-with-last O(1) 삭제 ---
                if (p.life <= 0) {
                    state.particles[i] = state.particles[state.particles.length - 1];
                    state.particles.length--;
                }
            }
        };

        // 이벤트
        ui.btnStart.addEventListener('click', startGame);
        ui.btnRestart.addEventListener('click', startGame);
        ui.themeBtns.forEach(btn => btn.addEventListener('click', () => applyTheme(btn.dataset.theme)));

        ui.btnSubmit.addEventListener('click', async () => {
            const name = ui.nameInput.value.trim();
            if (!name) { alert("이름을 입력해주세요."); return; }
            if (state.score === 0) { alert("점수가 0점이라 등록할 수 없습니다."); return; }
            ui.btnSubmit.disabled = true;
            ui.btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            ui.btnSubmit.innerText = "등록 중...";
            const success = await saveScoreToFirebase(name, state.score);
            if (success) {
                ui.submitMsg.classList.remove('hidden');
                ui.btnSubmit.innerText = "등록 완료";
            } else {
                alert("점수 등록에 실패했습니다.");
                ui.btnSubmit.disabled = false;
                ui.btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
                ui.btnSubmit.innerText = "등록";
            }
        });

        // 초기화
        const initApp = async () => {
            resizeCanvas();
            applyTheme(state.themeId);
            await Promise.all([initFirebase(), startCamera(), initMediaPipe()]);
            changeState('MENU');
            gameLoop(performance.now());
        };
        window.onload = initApp;
    </script>
</body>
</html>
