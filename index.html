<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>벚꽃 잡기 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; }
        .glass-panel { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); }
        .pink-glow { text-shadow: 0 0 10px #ffb7c5, 0 0 20px #ffb7c5; }
    </style>
</head>
<body class="relative text-white font-sans">

    <!-- 비디오 입력 (숨김) -->
    <video id="video" class="hidden" autoplay playsinline></video>
    
    <!-- 게임 렌더링 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 인게임 HUD (점수, 타이머) -->
    <div id="hud" class="absolute top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none hidden z-10">
        <div class="flex flex-col">
            <span class="text-xl text-pink-300 font-bold">점수</span>
            <span id="scoreDisplay" class="text-5xl font-extrabold pink-glow">0</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-xl text-pink-300 font-bold">남은 시간</span>
            <span id="timerDisplay" class="text-5xl font-extrabold">30</span>
        </div>
    </div>

    <!-- 로딩 화면 -->
    <div id="loadingScreen" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-gray-900">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-pink-400 mb-4"></div>
        <h2 class="text-2xl font-bold text-pink-300">카메라 및 AI 모델 로딩 중...</h2>
        <p class="text-gray-400 mt-2">잠시만 기다려주세요.</p>
    </div>

    <!-- 메인 메뉴 -->
    <div id="menuScreen" class="absolute inset-0 flex flex-col items-center justify-center z-40 glass-panel hidden">
        <h1 class="text-6xl font-extrabold text-pink-400 mb-8 pink-glow">🌸 벚꽃 잡기 🌸</h1>
        <p class="text-xl mb-8 text-center max-w-md text-gray-200">
            카메라 앞에서 <span class="text-pink-300 font-bold">손바닥을 펴서 벚꽃에 대고 주먹을 쥐어(Grab)</span> 떨어지는 벚꽃을 잡으세요!
        </p>
        <button id="startBtn" class="px-8 py-4 bg-pink-500 hover:bg-pink-600 rounded-full text-2xl font-bold transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(236,72,153,0.5)] mb-8">
            게임 시작
        </button>

        <div class="w-full max-w-sm bg-gray-800 bg-opacity-80 rounded-xl p-6 border border-pink-900 shadow-xl">
            <h2 class="text-2xl font-bold text-center text-pink-300 mb-4 border-b border-pink-800 pb-2">🏆 명예의 전당 (Top 5)</h2>
            <ul id="menuLeaderboard" class="space-y-2">
                <li class="text-center text-gray-400">데이터를 불러오는 중...</li>
            </ul>
        </div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center z-40 glass-panel hidden">
        <h1 class="text-5xl font-extrabold text-red-400 mb-2">TIME OVER</h1>
        <div class="text-2xl mb-6">최종 점수: <span id="finalScore" class="text-5xl font-bold text-pink-400 pink-glow ml-2">0</span></div>
        
        <div id="nameInputSection" class="flex flex-col items-center mb-8">
            <p class="mb-2 text-pink-200">순위표에 등록할 이름을 입력하세요</p>
            <div class="flex">
                <input type="text" id="playerName" placeholder="닉네임 (최대 8자)" maxlength="8" class="px-4 py-3 rounded-l-lg bg-gray-700 text-white border-none focus:ring-2 focus:ring-pink-500 outline-none w-48">
                <button id="submitScoreBtn" class="px-6 py-3 bg-pink-600 hover:bg-pink-700 rounded-r-lg font-bold transition-colors">등록</button>
            </div>
            <p id="submitMsg" class="text-sm mt-2 text-green-400 hidden">점수가 등록되었습니다!</p>
        </div>

        <div class="w-full max-w-sm bg-gray-800 bg-opacity-80 rounded-xl p-6 border border-pink-900 shadow-xl mb-6">
            <h2 class="text-2xl font-bold text-center text-pink-300 mb-4 border-b border-pink-800 pb-2">🏆 명예의 전당</h2>
            <ul id="gameOverLeaderboard" class="space-y-2">
                <!-- 리스트 동적 생성 -->
            </ul>
        </div>

        <button id="restartBtn" class="px-8 py-3 bg-gray-600 hover:bg-gray-500 rounded-full text-xl font-bold transition-colors shadow-lg">
            다시 시작하기
        </button>
    </div>

    <script type="module">
        // 1. Firebase 및 MediaPipe 라이브러리 임포트
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm";

        // ==========================================
        // Firebase 설정 (순위표 저장용)
        // ==========================================
        let db, auth, currentUser;
        const initFirebase = async () => {
            try {
                // 환경 변수에서 설정 가져오기 (가상 환경 지원)
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cherry-blossom-game';
                
                if (!firebaseConfig) {
                    console.warn("Firebase config not found. Leaderboard will be disabled.");
                    return null;
                }

                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // 인증 처리 (필수)
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                return new Promise((resolve) => {
                    onAuthStateChanged(auth, (user) => {
                        currentUser = user;
                        if (user) {
                            setupLeaderboard(appId);
                        }
                        resolve(user);
                    });
                });
            } catch (e) {
                console.error("Firebase init error:", e);
            }
        };

        // 순위표 실시간 리스너
        let topScores = [];
        const setupLeaderboard = (appId) => {
            if (!currentUser || !db) return;
            
            // 필수 규칙 1: 지정된 경로 사용
            const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            // 필수 규칙 2: 복잡한 쿼리(orderBy, limit) 없이 전체를 가져와 메모리에서 정렬
            onSnapshot(scoresRef, (snapshot) => {
                const allScores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // 점수 내림차순 정렬 후 상위 5개 추출
                topScores = allScores.sort((a, b) => b.score - a.score).slice(0, 5);
                renderLeaderboard();
            }, (error) => {
                console.error("Leaderboard fetch error:", error);
            });
        };

        const renderLeaderboard = () => {
            const createListHTML = () => {
                if (topScores.length === 0) return `<li class="text-center text-gray-400">아직 등록된 점수가 없습니다.</li>`;
                return topScores.map((score, index) => {
                    const rankColors = ['text-yellow-400', 'text-gray-300', 'text-amber-600', 'text-white', 'text-white'];
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    return `<li class="flex justify-between items-center bg-gray-700 bg-opacity-50 px-4 py-2 rounded">
                                <span class="font-bold ${rankColors[index] || 'text-white'}">${medal} ${score.name}</span>
                                <span class="font-bold text-pink-300">${score.score}점</span>
                            </li>`;
                }).join('');
            };

            const html = createListHTML();
            document.getElementById('menuLeaderboard').innerHTML = html;
            document.getElementById('gameOverLeaderboard').innerHTML = html;
        };

        const saveScoreToFirebase = async (name, score) => {
            if (!currentUser || !db || score <= 0) return false;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cherry-blossom-game';
                const scoresRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                await addDoc(scoresRef, {
                    name: name || "무명",
                    score: score,
                    uid: currentUser.uid,
                    timestamp: serverTimestamp()
                });
                return true;
            } catch (e) {
                console.error("Score save error:", e);
                return false;
            }
        };

        // ==========================================
        // 게임 로직 & MediaPipe 
        // ==========================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI 엘리먼트
        const ui = {
            loading: document.getElementById('loadingScreen'),
            menu: document.getElementById('menuScreen'),
            hud: document.getElementById('hud'),
            gameOver: document.getElementById('gameOverScreen'),
            scoreDisp: document.getElementById('scoreDisplay'),
            timerDisp: document.getElementById('timerDisplay'),
            finalScoreDisp: document.getElementById('finalScore'),
            nameInput: document.getElementById('playerName'),
            submitMsg: document.getElementById('submitMsg'),
            btnStart: document.getElementById('startBtn'),
            btnSubmit: document.getElementById('submitScoreBtn'),
            btnRestart: document.getElementById('restartBtn')
        };

        let handLandmarker;
        let lastVideoTime = -1;
        let animationFrameId;
        
        // 게임 상태
        const GAME_DURATION = 30; // 30초
        let state = {
            status: 'LOADING', // LOADING, MENU, PLAYING, GAMEOVER
            score: 0,
            timeLeft: GAME_DURATION,
            lastTick: 0,
            blossoms: [],
            particles: [],
            isGrabbing: false,
            grabPosList: []
        };

        // 벚꽃 객체 클래스
        class Blossom {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // 초기엔 화면 전체에 분포
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -50;
                this.size = Math.random() * 20 + 20; // 20~40px
                this.speed = Math.random() * 5 + 4;  // 4~9 속도
                this.swaySpeed = Math.random() * 0.05 + 0.02;
                this.swayAmount = Math.random() * 50 + 20;
                this.seed = Math.random() * 100;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
                this.active = true;
            }
            update(time) {
                if (!this.active) return;
                this.y += this.speed;
                this.x += Math.sin(time * this.swaySpeed + this.seed) * 2; // 좌우 살랑살랑
                this.rotation += this.rotSpeed;

                if (this.y > canvas.height + 50) {
                    this.reset();
                }
            }
            draw(ctx) {
                if (!this.active) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("🌸", 0, 0);
                ctx.restore();
            }
        }

        // 획득 시 파티클 애니메이션
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.life = 1.0;
                this.dy = -2;
            }
            update() {
                this.y += this.dy;
                this.life -= 0.03;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = "#ffb7c5";
                ctx.font = "bold 24px Arial";
                ctx.fillText("+1", this.x, this.y);
                ctx.restore();
            }
        }

        // 초기화: 캔버스 리사이즈
        const resizeCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // 벚꽃 개수 화면 크기에 비례 (밀도 대폭 증가: 기존 40000 -> 10000)
            const blossomCount = Math.floor((canvas.width * canvas.height) / 10000);
            if (state.blossoms.length === 0) {
                for (let i = 0; i < blossomCount; i++) state.blossoms.push(new Blossom());
            }
        };
        window.addEventListener('resize', resizeCanvas);

        // 카메라 설정
        const startCamera = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720, facingMode: "user" } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => { resolve(); };
                });
            } catch (err) {
                alert("카메라 접근 권한이 필요합니다!");
                console.error(err);
            }
        };

        // MediaPipe 초기화
        const initMediaPipe = async () => {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2 // 양손 인식
            });
        };

        // 게임 제어 함수
        const changeState = (newState) => {
            state.status = newState;
            ui.loading.classList.add('hidden');
            ui.menu.classList.add('hidden');
            ui.hud.classList.add('hidden');
            ui.gameOver.classList.add('hidden');

            if (newState === 'MENU') ui.menu.classList.remove('hidden');
            if (newState === 'PLAYING') ui.hud.classList.remove('hidden');
            if (newState === 'GAMEOVER') ui.gameOver.classList.remove('hidden');
        };

        const startGame = () => {
            state.score = 0;
            state.timeLeft = GAME_DURATION;
            state.lastTick = performance.now();
            ui.scoreDisp.innerText = state.score;
            ui.timerDisp.innerText = state.timeLeft;
            state.particles = [];
            state.blossoms.forEach(b => b.reset());
            
            ui.nameInput.value = '';
            ui.submitMsg.classList.add('hidden');
            ui.btnSubmit.disabled = false;
            ui.btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            
            changeState('PLAYING');
        };

        const gameOver = () => {
            changeState('GAMEOVER');
            ui.finalScoreDisp.innerText = state.score;
        };

        // 메인 렌더링 및 게임 루프
        const gameLoop = (timestamp) => {
            // 캔버스 클리어 및 카메라 미러링 그리기
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 카메라 이미지를 좌우 반전하여 캔버스에 가득 차게 그림
            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-canvas.width, 0);
            
            // Cover 비율 계산
            const vRatio = canvas.width / video.videoWidth;
            const hRatio = canvas.height / video.videoHeight;
            const ratio = Math.max(vRatio, hRatio);
            const centerShift_x = (canvas.width - video.videoWidth * ratio) / 2;
            const centerShift_y = (canvas.height - video.videoHeight * ratio) / 2;  
            
            ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight,
                          centerShift_x, centerShift_y, video.videoWidth * ratio, video.videoHeight * ratio);
            ctx.restore();

            // Hand Tracking 결과 가져오기
            let results = null;
            if (handLandmarker && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                results = handLandmarker.detectForVideo(video, timestamp);
            }

            // 주먹 쥐기(Grab) 로직
            state.isGrabbing = false;
            state.grabPosList = [];

            if (results && results.landmarks) {
                for (const landmarks of results.landmarks) {
                    // 손가락이 접혔는지 확인 (끝마디가 첫마디보다 손목에 가까운지)
                    const isFingerFolded = (tipIdx, mcpIdx) => {
                        const tip = landmarks[tipIdx];
                        const mcp = landmarks[mcpIdx];
                        const wrist = landmarks[0];
                        const distTip = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
                        const distMcp = Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y);
                        return distTip < distMcp;
                    };

                    // 검지, 중지, 약지, 새끼가 모두 접혀있으면 주먹(Grab)으로 간주
                    const isGrab = isFingerFolded(8, 5) && isFingerFolded(12, 9) && isFingerFolded(16, 13) && isFingerFolded(20, 17);

                    // 손바닥 중심점 (중지 기저 부분 9번 랜드마크)
                    const palm = landmarks[9];
                    // 좌표 변환 (MediaPipe는 0~1 정규화값, 미러링되었으므로 X축 반전 필요)
                    const px = (1 - palm.x) * canvas.width;
                    const py = palm.y * canvas.height;

                    // 화면 크기에 비례한 손바닥 인식 반경 (최소 60px 보장)
                    const grabRadius = Math.max(canvas.width * 0.08, 60);

                    // 손바닥 위치 시각적 표시 (플레이어 가이드)
                    ctx.beginPath();
                    ctx.arc(px, py, grabRadius, 0, 2 * Math.PI);
                    
                    if (isGrab) {
                        state.isGrabbing = true;
                        state.grabPosList.push({ x: px, y: py, radius: grabRadius });
                        ctx.fillStyle = 'rgba(0, 255, 100, 0.4)'; // 주먹 쥐면 초록색
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = "lime";
                    } else {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; // 평소엔 흰색 반투명
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                }
            }

            // 플레이 중일 때 업데이트 로직
            if (state.status === 'PLAYING') {
                // 타이머 처리
                if (timestamp - state.lastTick >= 1000) {
                    state.timeLeft--;
                    ui.timerDisp.innerText = state.timeLeft;
                    state.lastTick = timestamp;
                    
                    if (state.timeLeft <= 0) {
                        gameOver();
                    }
                }

                // 벚꽃 업데이트 및 충돌 체크
                state.blossoms.forEach(blossom => {
                    blossom.update(timestamp);
                    
                    // 주먹 쥐기(Grab) 충돌 처리
                    if (state.isGrabbing && blossom.active) {
                        for (const pos of state.grabPosList) {
                            const distToBlossom = Math.hypot(pos.x - blossom.x, pos.y - blossom.y);
                            // 잡히는 반경: 손바닥 반경 + 벚꽃 크기
                            if (distToBlossom < pos.radius + blossom.size) {
                                blossom.active = false;
                                state.score++;
                                ui.scoreDisp.innerText = state.score;
                                
                                // 파티클 생성
                                state.particles.push(new Particle(blossom.x, blossom.y));
                                
                                // 약간의 딜레이 후 다시 위에서 스폰
                                setTimeout(() => { blossom.reset(); }, 500);
                                break; // 이 벚꽃은 잡혔으므로 다른 손 검사 패스
                            }
                        }
                    }
                });
            } else if (state.status === 'MENU' || state.status === 'GAMEOVER') {
                // 메뉴/종료 화면에서도 배경으로 벚꽃은 계속 떨어지게 연출
                state.blossoms.forEach(b => b.update(timestamp));
            }

            // 벚꽃 그리기
            state.blossoms.forEach(b => b.draw(ctx));

            // 파티클 업데이트 및 그리기
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) state.particles.splice(i, 1);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        };

        // 버튼 이벤트 리스너 세팅
        ui.btnStart.addEventListener('click', startGame);
        ui.btnRestart.addEventListener('click', startGame);
        
        ui.btnSubmit.addEventListener('click', async () => {
            const name = ui.nameInput.value.trim();
            if (!name) {
                alert("이름을 입력해주세요.");
                return;
            }
            if (state.score === 0) {
                alert("점수가 0점이라 등록할 수 없습니다.");
                return;
            }

            ui.btnSubmit.disabled = true;
            ui.btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            ui.btnSubmit.innerText = "등록 중...";

            const success = await saveScoreToFirebase(name, state.score);
            if (success) {
                ui.submitMsg.classList.remove('hidden');
                ui.btnSubmit.innerText = "등록 완료";
            } else {
                alert("점수 등록에 실패했습니다. (DB 연결 확인)");
                ui.btnSubmit.disabled = false;
                ui.btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
                ui.btnSubmit.innerText = "등록";
            }
        });

        // 앱 초기 구동
        const initApp = async () => {
            resizeCanvas();
            
            // 병렬로 리소스 로딩
            const pFirebase = initFirebase();
            const pCamera = startCamera();
            const pModel = initMediaPipe();

            await Promise.all([pFirebase, pCamera, pModel]);
            
            // 로딩 완료 후 메뉴 전환 및 루프 시작
            changeState('MENU');
            gameLoop(performance.now());
        };

        // 시작
        window.onload = initApp;

    </script>
</body>
</html>
